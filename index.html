<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Local Board</title>
<style>
  :root{
    --bg:#f4f5f7; --panel:#ffffff; --bd:#e5e7eb; --tx:#1a1a1e; --sub:#6b7280;
    --acc:#2563eb; --acc-soft:#e8effe; --shadow:0 2px 10px rgba(16,24,40,.10);
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;overflow:hidden;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    color:var(--tx);background:var(--bg);-webkit-user-select:none;user-select:none;touch-action:none}
  #canvas{display:block;position:fixed;inset:0;background:
    radial-gradient(circle, #d7dae1 1px, transparent 1px) 0 0/22px 22px, var(--bg);cursor:default}

  .bar{position:fixed;z-index:10;display:flex;align-items:center;gap:6px;
    background:var(--panel);border:1px solid var(--bd);border-radius:12px;
    box-shadow:var(--shadow);padding:6px}
  #tools{top:14px;left:50%;transform:translateX(-50%)}
  #left{top:14px;left:14px;gap:10px;padding:8px 12px;font-size:13px}
  #right{top:14px;right:14px}
  .btn{all:unset;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px;
    height:34px;min-width:34px;padding:0 10px;border-radius:8px;font-size:13px;color:var(--tx);white-space:nowrap}
  .btn:hover{background:#f1f2f4}
  .btn.on{background:var(--acc-soft);color:var(--acc)}
  .btn.primary{background:var(--acc);color:#fff}
  .btn.primary:hover{background:#1d4fd7}
  .btn svg{width:18px;height:18px;pointer-events:none}
  .sep{width:1px;height:24px;background:var(--bd);margin:0 2px}
  input[type=color]{width:30px;height:30px;border:none;background:none;padding:0;cursor:pointer;border-radius:8px}
  input[type=range]{width:88px}
  .dot{width:9px;height:9px;border-radius:50%;background:#c7ccd4;flex:none}
  .dot.live{background:#16a34a;box-shadow:0 0 0 3px rgba(22,163,74,.15)}
  #status{font-size:12px;color:var(--sub)}
  #name{font-weight:600}
  .chip{display:none;align-items:center;gap:7px;height:34px;padding:0 10px;border-radius:8px;
    background:var(--acc-soft);color:var(--acc);font-size:13px;font-weight:600;cursor:pointer}
  .chip .sw{width:10px;height:10px;border-radius:3px}
  .hint{position:fixed;bottom:12px;left:50%;transform:translateX(-50%);z-index:10;
    font-size:12px;color:var(--sub);background:var(--panel);border:1px solid var(--bd);
    border-radius:999px;padding:6px 14px;box-shadow:var(--shadow)}
  #peers{position:fixed;bottom:12px;right:12px;z-index:10;font-size:12px;color:var(--sub);
    background:var(--panel);border:1px solid var(--bd);border-radius:10px;padding:8px 12px;
    box-shadow:var(--shadow);max-width:250px;display:none}
  #peers b{color:var(--tx)}
  #peers .pw{display:flex;align-items:center;gap:7px;margin-top:5px}
  #peers .sw{width:10px;height:10px;border-radius:3px;flex:none}
  #peers .me{font-weight:600;color:var(--tx)}

  .overlay{position:fixed;inset:0;z-index:50;background:rgba(17,24,39,.35);
    display:none;align-items:center;justify-content:center}
  .modal{background:var(--panel);border:1px solid var(--bd);border-radius:16px;
    box-shadow:0 20px 60px rgba(16,24,40,.25);width:min(92vw,440px);max-height:80vh;
    overflow:auto;padding:22px}
  .modal h2{margin:0 0 4px;font-size:18px}
  .modal p{margin:0 0 16px;color:var(--sub);font-size:13px}
  .chan{display:flex;align-items:center;gap:10px;width:100%;text-align:left;
    border:1px solid var(--bd);background:#fff;border-radius:10px;padding:11px 13px;margin:0 0 8px;cursor:pointer}
  .chan:hover{border-color:var(--acc);background:var(--acc-soft)}
  .chan .sw{width:12px;height:12px;border-radius:4px;flex:none}
  .chan .meta{flex:1;min-width:0}
  .chan .t{font-weight:600;font-size:14px}
  .chan .s{font-size:12px;color:var(--sub)}
  .chan .taken{font-size:11px;color:#b45309;background:#fef3c7;border-radius:6px;padding:2px 7px}
  .modal .row{display:flex;gap:8px;margin-top:8px}
  .modal input[type=text]{flex:1;border:1px solid var(--bd);border-radius:9px;padding:9px 11px;font-size:14px}
</style>
</head>
<body>
<canvas id="canvas"></canvas>

<div class="bar" id="left">
  <span class="dot" id="syncdot"></span>
  <span id="name">…</span>
  <span id="status">local only</span>
</div>

<div class="bar" id="tools">
  <button class="btn on" data-tool="select" title="Select / move (V)">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m3 3 7.5 18 2.6-7.9L21 10.5z"/></svg>
  </button>
  <button class="btn" data-tool="pen" title="Draw (P)">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19l7-7 3 3-7 7-3-3z"/><path d="M18 13l-1.5-7.5L2 2l3.5 14.5L13 18z"/><path d="M2 2l7.586 7.586"/><circle cx="11" cy="11" r="2"/></svg>
  </button>
  <button class="btn" data-tool="pan" title="Pan (hold Space)">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 11V6a2 2 0 0 0-2-2 2 2 0 0 0-2 2 2 2 0 0 0-2-2 2 2 0 0 0-2 2v0a2 2 0 0 0-2-2 2 2 0 0 0-2 2v8"/><path d="M14 10V4a2 2 0 0 1 4 0v6"/><path d="M6 14c-1.5-2-3-2.5-3-4a2 2 0 0 1 4 0"/><path d="M18 8a2 2 0 1 1 4 0v6a8 8 0 0 1-8 8h-2a8 8 0 0 1-7-4l-2.5-4"/></svg>
  </button>
  <span class="sep"></span>
  <input type="color" id="color" value="#111827" title="Colour">
  <input type="range" id="width" min="1" max="24" value="3" title="Brush size">
  <span class="sep"></span>
  <button class="btn" id="addImg" title="Add image">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="9" cy="9" r="2"/><path d="m21 15-3.5-3.5L9 20"/></svg>
    Image
  </button>
  <button class="btn" id="del" title="Delete selected (Del)">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2m2 0v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/></svg>
  </button>
  <button class="btn" id="undo" title="Undo (Ctrl+Z)">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14 4 9l5-5"/><path d="M4 9h11a5 5 0 0 1 0 10h-1"/></svg>
  </button>
  <button class="btn" id="fit" title="Fit to content">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3H5a2 2 0 0 0-2 2v3m0 8v3a2 2 0 0 0 2 2h3m8 0h3a2 2 0 0 0 2-2v-3m0-8V5a2 2 0 0 0-2-2h-3"/></svg>
  </button>
</div>

<div class="bar" id="right">
  <button class="btn primary" id="connect" title="Connect a shared folder (Chrome/Edge)">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h16a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.9a2 2 0 0 1-1.69-.9L9.6 3.9A2 2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v13c0 1.1.9 2 2 2Z"/></svg>
    Connect folder
  </button>
  <span class="chip" id="chanchip" title="Your channel — click to switch"><span class="sw"></span><span id="channame"></span></button>
  <button class="btn primary" id="syncnow" title="Synchronise now (auto-runs too)" style="display:none">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 0 0-9-9 9 9 0 0 0-6.7 3M3 12a9 9 0 0 0 9 9 9 9 0 0 0 6.7-3"/><path d="M21 3v6h-6M3 21v-6h6"/></svg>
    Synchronise
  </button>
  <span class="sep"></span>
  <button class="btn" id="exp" title="Export my channel as JSON">Export</button>
  <button class="btn" id="imp" title="Import a JSON layer">Import</button>
  <button class="btn" id="rename" title="Change my name">Name</button>
</div>

<div class="hint">Drop images anywhere · draw with the pen · scroll to zoom · Space-drag to pan</div>
<div id="peers"></div>

<div class="overlay" id="overlay">
  <div class="modal">
    <h2>Pick your channel</h2>
    <p>You can edit <b>one</b> channel. Everyone else's channels stay visible but read-only. Pick an empty one, or create your own.</p>
    <div id="chanlist"></div>
    <div class="row">
      <input type="text" id="newchan" placeholder="New channel name (e.g. your name)">
      <button class="btn primary" id="createchan">Create</button>
    </div>
  </div>
</div>

<input type="file" id="fileImg" accept="image/*" multiple hidden>
<input type="file" id="fileJson" accept="application/json,.json" hidden>

<script>
(function(){
  "use strict";
  var canvas=document.getElementById('canvas'), ctx=canvas.getContext('2d');
  var dpr=1, W=0, H=0;

  // ---- identity + channel ----------------------------------------------
  var me = localStorage.getItem('lb_user') || '';
  if(!me){ me = (prompt('Your name:','') || '').trim(); }
  if(!me){ me = 'guest-' + Math.floor(Math.random()*9000+1000); }
  localStorage.setItem('lb_user', me);
  function safe(s){ return String(s).toLowerCase().replace(/[^a-z0-9_-]+/g,'-').replace(/^-+|-+$/g,'') || 'x'; }
  document.getElementById('name').textContent = me;

  var myChannel = localStorage.getItem('lb_channel') || '';   // filename, e.g. board-anna.json
  function chanLabel(fn){ return (fn||'').replace(/^board-/,'').replace(/\.json$/,''); }
  function chanFile(label){ return 'board-' + safe(label) + '.json'; }

  function uid(){ return Date.now().toString(36)+'-'+Math.floor(Math.random()*1e6).toString(36); }
  function hueColor(u){ var h=0; for(var i=0;i<u.length;i++) h=(h*31+u.charCodeAt(i))%360; return 'hsl('+h+' 65% 52%)'; }

  // ---- state ------------------------------------------------------------
  var mine = [];              // objects of MY channel (authoritative in memory)
  var others = {};            // fileName -> { user, objects }  (read-only)
  var view = { s:1, tx:0, ty:0 };
  var tool='select', color='#111827', width=3, sel=null;
  var imgCache={}, undoStack=[];
  var dirHandle=null, scanning=false, folderIndex={}, parsedCache={}, pendingResume=false;

  function allObjects(){
    var out = mine.slice();
    for(var fn in others) out = out.concat(others[fn].objects||[]);
    return out;
  }
  function getImg(src){ if(imgCache[src]) return imgCache[src]; var im=new Image(); im.onload=render; im.src=src; imgCache[src]=im; return im; }

  // ---- local cache (IndexedDB — no ~5MB localStorage limit) -------------
  var DB=null;
  function idbOpen(){ return new Promise(function(res){ try{ var r=indexedDB.open('localboard',1);
    r.onupgradeneeded=function(){ r.result.createObjectStore('boards'); };
    r.onsuccess=function(){ DB=r.result; res(DB); }; r.onerror=function(){ res(null); }; }catch(e){ res(null); } }); }
  function idbGet(k){ return new Promise(function(res){ if(!DB) return res(null); try{ var t=DB.transaction('boards','readonly').objectStore('boards').get(k); t.onsuccess=function(){ res(t.result||null); }; t.onerror=function(){ res(null); }; }catch(e){ res(null); } }); }
  function idbSet(k,v){ return new Promise(function(res){ if(!DB) return res(); try{ var t=DB.transaction('boards','readwrite').objectStore('boards').put(v,k); t.onsuccess=function(){ res(); }; t.onerror=function(){ res(); }; }catch(e){ res(); } }); }

  function mineKey(){ return 'mine:' + safe(myChannel||'local'); }
  function saveLocal(){ idbSet(mineKey(), mine); }
  async function loadLocal(){ var v=await idbGet(mineKey()); if(Array.isArray(v)) mine=v; }

  function snapshot(){ undoStack.push(JSON.stringify(mine)); if(undoStack.length>60) undoStack.shift(); }
  function undo(){ if(!undoStack.length) return; mine=JSON.parse(undoStack.pop()); sel=null; commit(); }
  function commit(){ saveLocal(); scheduleWrite(); render(); }

  // ---- shared folder (File System Access API) ---------------------------
  var writeTimer=null, writing=false, writeAgain=false;
  function scheduleWrite(){ if(!dirHandle||!myChannel) return; clearTimeout(writeTimer); writeTimer=setTimeout(writeMine, 600); }
  async function writeMine(){
    if(!dirHandle||!myChannel) return;
    if(writing){ writeAgain=true; return; }   // serialise: never open two writables on the same file
    writing=true;
    try{
      var h=await dirHandle.getFileHandle(myChannel, {create:true});
      var w=await h.createWritable();
      await w.write(new Blob([JSON.stringify({user:me, channel:chanLabel(myChannel), t:Date.now(), objects:mine})],{type:'application/json'}));
      await w.close();
    }catch(e){ console.warn('write failed', e); }
    finally{ writing=false; if(writeAgain){ writeAgain=false; writeMine(); } }
  }
  // read every board-*.json into folderIndex; returns it
  async function readAll(){
    var idx={};
    for await (var entry of dirHandle.values()){
      if(entry.kind!=='file' || !/^board-.+\.json$/i.test(entry.name)) continue;
      var fn=entry.name;
      try{
        var f=await entry.getFile();
        var cached=parsedCache[fn];
        if(cached && cached.lm===f.lastModified){ idx[fn]={ user:cached.user, objects:cached.objects }; continue; } // unchanged: skip re-parse
        var d=JSON.parse(await f.text());
        var rec={ user:d.user||chanLabel(fn), objects:Array.isArray(d.objects)?d.objects:[] };
        parsedCache[fn]={ lm:f.lastModified, user:rec.user, objects:rec.objects };
        idx[fn]=rec;
      }catch(e){ idx[fn]={ user:chanLabel(fn), objects:[] }; }
    }
    folderIndex=idx; return idx;
  }
  async function syncNow(pushFirst){
    if(!dirHandle||scanning) return; scanning=true;
    try{
      if(pushFirst) await writeMine();
      var idx=await readAll();
      var o={};
      for(var fn in idx){ if(fn!==myChannel) o[fn]=idx[fn]; }
      others=o; render(); updatePeers(); flashSync();
    }catch(e){ console.warn('sync failed', e); }
    finally{ scanning=false; }
  }

  async function connectFolder(){
    if(!window.showDirectoryPicker){
      alert('Folder sync needs Chrome or Edge.\nOn Safari/Firefox use Export / Import instead.');
      return;
    }
    try{
      dirHandle=await window.showDirectoryPicker({ mode:'readwrite', id:'localboard' });
      if(dirHandle.requestPermission){ var p=await dirHandle.requestPermission({mode:'readwrite'}); if(p!=='granted'){ dirHandle=null; return; } }
      idbSet('dirHandle', dirHandle);   // remember folder so we can auto-reconnect on reload
      await readAll();
      if(myChannel && folderIndex[myChannel]){ adoptChannel(myChannel, true); startSync(); }
      else openChannelPicker();
    }catch(e){ /* cancelled */ }
  }
  // Reconnect to the remembered folder without re-picking it.
  async function resumeFolder(){
    var h=await idbGet('dirHandle'); if(!h) return connectFolder();
    try{
      var p = h.requestPermission ? await h.requestPermission({mode:'readwrite'}) : 'granted';
      if(p!=='granted'){ pendingResume=true; return; }
      dirHandle=h; await readAll();
      if(myChannel && folderIndex[myChannel]){ adoptChannel(myChannel, true); startSync(); }
      else openChannelPicker();
    }catch(e){ connectFolder(); }
  }
  function armResume(){ pendingResume=true; var b=document.getElementById('connect');
    var tn=b.childNodes[b.childNodes.length-1]; if(tn) tn.nodeValue=' Resume sync'; }

  function adoptChannel(fn, keepMineIfNew){
    myChannel=fn; localStorage.setItem('lb_channel', fn);
    if(folderIndex[fn]){ mine=JSON.parse(JSON.stringify(folderIndex[fn].objects||[])); }
    else if(!keepMineIfNew){ mine=[]; }
    undoStack=[]; sel=null;
    var o={}; for(var k in folderIndex){ if(k!==fn) o[k]=folderIndex[k]; } others=o;
    var sw=document.querySelector('#chanchip .sw'); if(sw) sw.style.background=hueColor(me);
    document.getElementById('channame').textContent=chanLabel(fn);
    document.getElementById('chanchip').style.display='inline-flex';
    document.getElementById('syncnow').style.display='inline-flex';
    document.getElementById('connect').style.display='none';
    saveLocal(); render(); updatePeers();
  }
  function startSync(){
    setSyncUI(true);
    if(!window._lbPoll) window._lbPoll=setInterval(function(){ syncNow(false); }, 1000);
    writeMine();
  }
  function setSyncUI(on){
    document.getElementById('syncdot').classList.toggle('live', !!on);
    document.getElementById('status').textContent = on ? 'channel: '+chanLabel(myChannel) : 'local only';
  }
  function flashSync(){ var d=document.getElementById('syncdot'); d.style.transform='scale(1.5)'; setTimeout(function(){ d.style.transform='scale(1)'; },150); }

  // ---- channel picker modal --------------------------------------------
  function openChannelPicker(){
    var list=document.getElementById('chanlist'); list.innerHTML='';
    var names=Object.keys(folderIndex);
    if(!names.length){ list.innerHTML='<p style="margin:0 0 8px">No channels yet — create the first one below.</p>'; }
    names.forEach(function(fn){
      var info=folderIndex[fn], empty=(info.objects||[]).length===0;
      var el=document.createElement('button'); el.className='chan';
      el.innerHTML='<span class="sw" style="background:'+hueColor(info.user||fn)+'"></span>'+
        '<span class="meta"><span class="t">'+chanLabel(fn)+'</span><span class="s">'+
        (empty?'empty':((info.objects.length)+' items')+' · last by '+(info.user||'?'))+'</span></span>'+
        (empty?'':'<span class="taken">in use</span>');
      el.addEventListener('click', function(){ closeModal(); adoptChannel(fn, false); startSync(); });
      list.appendChild(el);
    });
    document.getElementById('overlay').style.display='flex';
  }
  function closeModal(){ document.getElementById('overlay').style.display='none'; }
  document.getElementById('overlay').addEventListener('click', function(e){ if(e.target.id==='overlay' && myChannel) closeModal(); });
  document.getElementById('createchan').addEventListener('click', function(){
    var label=(document.getElementById('newchan').value||'').trim() || me;
    var fn=chanFile(label);
    var keep = !myChannel && mine.length>0;   // first-time: keep local sketches as this channel
    if(!folderIndex[fn]) folderIndex[fn]={ user:me, objects: keep?mine:[] };
    closeModal(); adoptChannel(fn, keep); startSync();
  });

  function updatePeers(){
    var box=document.getElementById('peers');
    if(!dirHandle && !Object.keys(others).length){ box.style.display='none'; return; }
    var chans=Object.keys(others);
    var total=chans.length+(myChannel?1:0);
    var html='<b>'+total+'</b> channel'+(total===1?'':'s')+' on this board';
    if(myChannel) html+='<div class="pw me"><span class="sw" style="background:'+hueColor(me)+'"></span>'+chanLabel(myChannel)+' — you</div>';
    chans.forEach(function(fn){ var u=others[fn].user||chanLabel(fn);
      html+='<div class="pw"><span class="sw" style="background:'+hueColor(u)+'"></span>'+chanLabel(fn)+' · '+u+'</div>'; });
    box.innerHTML=html; box.style.display='block';
  }

  // ---- view / coords ----------------------------------------------------
  function resize(){ dpr=window.devicePixelRatio||1; W=window.innerWidth; H=window.innerHeight;
    canvas.width=Math.round(W*dpr); canvas.height=Math.round(H*dpr); canvas.style.width=W+'px'; canvas.style.height=H+'px'; render(); }
  function toWorld(sx,sy){ return { x:(sx-view.tx)/view.s, y:(sy-view.ty)/view.s }; }
  function evPos(e){ var r=canvas.getBoundingClientRect(); return { x:e.clientX-r.left, y:e.clientY-r.top }; }
  function bboxOf(o){ if(o.type==='image') return {x:o.x,y:o.y,w:o.w,h:o.h};
    var xs=o.pts.map(function(p){return p[0];}), ys=o.pts.map(function(p){return p[1];});
    var x=Math.min.apply(null,xs), y=Math.min.apply(null,ys); return {x:x,y:y,w:Math.max.apply(null,xs)-x,h:Math.max.apply(null,ys)-y}; }

  // ---- render -----------------------------------------------------------
  var cur=null;
  function render(){
    ctx.setTransform(dpr,0,0,dpr,0,0); ctx.clearRect(0,0,W,H);
    ctx.save(); ctx.translate(view.tx,view.ty); ctx.scale(view.s,view.s);
    var objs=allObjects();
    objs.forEach(function(o){ if(o.type==='image'){ var im=getImg(o.src); if(im.complete&&im.naturalWidth) ctx.drawImage(im,o.x,o.y,o.w,o.h); } });
    objs.forEach(function(o){ if(o.type==='stroke') drawStroke(o); });
    if(cur) drawStroke(cur);
    if(sel){ var b=bboxOf(sel); ctx.save(); ctx.strokeStyle='#2563eb'; ctx.lineWidth=1.5/view.s; ctx.setLineDash([6/view.s,4/view.s]);
      ctx.strokeRect(b.x-6/view.s,b.y-6/view.s,b.w+12/view.s,b.h+12/view.s); ctx.setLineDash([]);
      if(sel.type==='image'){ ctx.fillStyle='#2563eb'; var hs=8/view.s; ctx.fillRect(sel.x+sel.w-hs/2, sel.y+sel.h-hs/2, hs, hs); } ctx.restore(); }
    ctx.restore();
  }
  function drawStroke(o){ if(!o.pts.length) return; ctx.save(); ctx.strokeStyle=o.color; ctx.lineWidth=o.width; ctx.lineCap='round'; ctx.lineJoin='round';
    ctx.beginPath(); ctx.moveTo(o.pts[0][0],o.pts[0][1]); for(var i=1;i<o.pts.length;i++) ctx.lineTo(o.pts[i][0],o.pts[i][1]);
    if(o.pts.length===1) ctx.lineTo(o.pts[0][0]+0.01,o.pts[0][1]+0.01); ctx.stroke(); ctx.restore(); }

  // ---- hit testing (mine only) -----------------------------------------
  function hitHandle(o,w){ if(!o||o.type!=='image') return false; var hs=10/view.s; return Math.abs(w.x-(o.x+o.w))<hs && Math.abs(w.y-(o.y+o.h))<hs; }
  function hitTest(w){ for(var i=mine.length-1;i>=0;i--){ var o=mine[i];
      if(o.type==='image'){ if(w.x>=o.x&&w.x<=o.x+o.w&&w.y>=o.y&&w.y<=o.y+o.h) return o; }
      else { var tol=Math.max(8/view.s,o.width/2+4/view.s); for(var j=0;j<o.pts.length-1;j++){ if(segDist(w,o.pts[j],o.pts[j+1])<tol) return o; }
        if(o.pts.length===1 && dist(w.x,w.y,o.pts[0][0],o.pts[0][1])<tol) return o; } } return null; }
  function dist(ax,ay,bx,by){ return Math.hypot(ax-bx,ay-by); }
  function segDist(p,a,b){ var vx=b[0]-a[0],vy=b[1]-a[1],wx=p.x-a[0],wy=p.y-a[1]; var c1=vx*wx+vy*wy; if(c1<=0) return dist(p.x,p.y,a[0],a[1]);
    var c2=vx*vx+vy*vy; if(c2<=c1) return dist(p.x,p.y,b[0],b[1]); var t=c1/c2; return dist(p.x,p.y,a[0]+t*vx,a[1]+t*vy); }

  // ---- pointer ----------------------------------------------------------
  var mode=null,last=null,dragStart=null,spaceDown=false;
  canvas.addEventListener('pointerdown', function(e){
    canvas.setPointerCapture(e.pointerId);
    var s=evPos(e), w=toWorld(s.x,s.y);
    if(spaceDown||tool==='pan'||e.button===1){ mode='pan'; last=s; canvas.style.cursor='grabbing'; return; }
    if(tool==='pen'){ mode='draw'; cur={id:uid(),owner:me,type:'stroke',color:color,width:width,pts:[[w.x,w.y]]}; return; }
    if(sel&&hitHandle(sel,w)){ mode='resize'; snapshot(); dragStart={w:w,ow:sel.w,oh:sel.h}; return; }
    var hit=hitTest(w);
    if(hit){ sel=hit; mode='move'; snapshot(); dragStart={w:w}; render(); }
    else { sel=null; mode='pan'; last=s; canvas.style.cursor='grabbing'; render(); }
  });
  canvas.addEventListener('pointermove', function(e){
    var s=evPos(e), w=toWorld(s.x,s.y);
    if(mode==='pan'){ view.tx+=s.x-last.x; view.ty+=s.y-last.y; last=s; render(); return; }
    if(mode==='draw'){ var p=cur.pts[cur.pts.length-1]; if(dist(w.x,w.y,p[0],p[1])>1/view.s){ cur.pts.push([w.x,w.y]); render(); } return; }
    if(mode==='move'&&sel){ var dx=w.x-dragStart.w.x, dy=w.y-dragStart.w.y; dragStart.w=w;
      if(sel.type==='image'){ sel.x+=dx; sel.y+=dy; } else { sel.pts=sel.pts.map(function(p){return [p[0]+dx,p[1]+dy];}); } render(); return; }
    if(mode==='resize'&&sel){ sel.w=Math.max(20,dragStart.ow+(w.x-dragStart.w.x)); sel.h=Math.max(20,dragStart.oh+(w.y-dragStart.w.y)); render(); return; }
    if(tool==='select') canvas.style.cursor=hitTest(w)?'move':'default';
    else if(tool==='pen') canvas.style.cursor='crosshair'; else canvas.style.cursor='grab';
  });
  function endPointer(e){ try{ canvas.releasePointerCapture(e.pointerId); }catch(_){}
    if(mode==='draw'&&cur){ if(cur.pts.length>=1){ snapshot(); mine.push(cur); commit(); } cur=null; }
    else if(mode==='move'||mode==='resize'){ commit(); } mode=null; canvas.style.cursor='default'; }
  canvas.addEventListener('pointerup', endPointer);
  canvas.addEventListener('pointercancel', endPointer);
  canvas.addEventListener('wheel', function(e){ e.preventDefault(); var s=evPos(e); var factor=e.deltaY<0?1.1:1/1.1;
    var ns=Math.min(8,Math.max(0.05,view.s*factor)); factor=ns/view.s; view.tx=s.x-(s.x-view.tx)*factor; view.ty=s.y-(s.y-view.ty)*factor; view.s=ns; render(); }, {passive:false});

  // ---- images -----------------------------------------------------------
  function fileToImage(file){ return new Promise(function(res,rej){ var r=new FileReader();
    r.onload=function(){ var im=new Image(); im.onload=function(){ res(im); }; im.onerror=rej; im.src=r.result; }; r.onerror=rej; r.readAsDataURL(file); }); }
  // resize to a sane max dimension and re-encode (webp, jpeg fallback) so images
  // are ~10-20x smaller than raw base64 — keeps IndexedDB + channel JSON light.
  function compress(img){ var max=1600, sc=Math.min(1,max/Math.max(img.naturalWidth,img.naturalHeight));
    var w=Math.max(1,Math.round(img.naturalWidth*sc)), h=Math.max(1,Math.round(img.naturalHeight*sc));
    var c=document.createElement('canvas'); c.width=w; c.height=h; c.getContext('2d').drawImage(img,0,0,w,h);
    var out=''; try{ out=c.toDataURL('image/webp',0.85); }catch(e){}
    if(out.indexOf('data:image/webp')!==0){ out=c.toDataURL('image/jpeg',0.85); }
    return { src:out, w:w, h:h }; }
  function addImageFile(file, atWorld){
    fileToImage(file).then(function(img){
      var cmp=compress(img);
      var max=340, sc=Math.min(1,max/Math.max(cmp.w,cmp.h)), w=cmp.w*sc, h=cmp.h*sc, c=atWorld||toWorld(W/2,H/2);
      getImg(cmp.src);
      snapshot(); mine.push({id:uid(),owner:me,type:'image',src:cmp.src,x:c.x-w/2,y:c.y-h/2,w:w,h:h}); commit();
    }).catch(function(e){ console.warn('image failed', e); });
  }
  ['dragenter','dragover'].forEach(function(t){ window.addEventListener(t,function(e){ e.preventDefault(); }); });
  window.addEventListener('drop', function(e){ e.preventDefault(); var s=evPos(e), w=toWorld(s.x,s.y), files=e.dataTransfer.files, off=0;
    for(var i=0;i<files.length;i++){ if(/^image\//.test(files[i].type)){ addImageFile(files[i],{x:w.x+off,y:w.y+off}); off+=24; } } });
  window.addEventListener('paste', function(e){ var items=e.clipboardData&&e.clipboardData.items; if(!items) return;
    for(var i=0;i<items.length;i++){ if(items[i].type.indexOf('image')===0){ var f=items[i].getAsFile(); if(f) addImageFile(f,null); } } });

  // ---- fit --------------------------------------------------------------
  function fit(){ var objs=allObjects(); if(!objs.length){ view={s:1,tx:0,ty:0}; render(); return; }
    var b=bboxOf(objs[0]), minx=b.x,miny=b.y,maxx=b.x+b.w,maxy=b.y+b.h;
    objs.forEach(function(o){ var bb=bboxOf(o); minx=Math.min(minx,bb.x); miny=Math.min(miny,bb.y); maxx=Math.max(maxx,bb.x+bb.w); maxy=Math.max(maxy,bb.y+bb.h); });
    var pad=60, bw=Math.max(1,maxx-minx), bh=Math.max(1,maxy-miny); var s=Math.max(0.05,Math.min((W-2*pad)/bw,(H-2*pad)/bh,4));
    view.s=s; view.tx=W/2-(minx+bw/2)*s; view.ty=H/2-(miny+bh/2)*s; render(); }

  // ---- toolbar ----------------------------------------------------------
  function setTool(t){ tool=t; if(t!=='select') sel=null;
    [].forEach.call(document.querySelectorAll('[data-tool]'),function(b){ b.classList.toggle('on',b.dataset.tool===t); });
    canvas.style.cursor=t==='pen'?'crosshair':(t==='pan'?'grab':'default'); render(); }
  [].forEach.call(document.querySelectorAll('[data-tool]'),function(b){ b.addEventListener('click',function(){ setTool(b.dataset.tool); }); });
  document.getElementById('color').addEventListener('input',function(e){ color=e.target.value; });
  document.getElementById('width').addEventListener('input',function(e){ width=+e.target.value; });
  document.getElementById('addImg').addEventListener('click',function(){ document.getElementById('fileImg').click(); });
  document.getElementById('fileImg').addEventListener('change',function(e){ [].forEach.call(e.target.files,function(f){ if(/^image\//.test(f.type)) addImageFile(f,null); }); e.target.value=''; });
  document.getElementById('del').addEventListener('click',delSel);
  document.getElementById('undo').addEventListener('click',undo);
  document.getElementById('fit').addEventListener('click',fit);
  document.getElementById('connect').addEventListener('click',function(){ if(pendingResume){ pendingResume=false; resumeFolder(); } else connectFolder(); });
  document.getElementById('syncnow').addEventListener('click',function(){ syncNow(true); });
  document.getElementById('chanchip').addEventListener('click',function(){ readAll().then(openChannelPicker); });
  document.getElementById('rename').addEventListener('click',function(){ var n=(prompt('Your name:',me)||'').trim(); if(!n) return; localStorage.setItem('lb_user',n); location.reload(); });
  function delSel(){ if(sel){ snapshot(); var i=mine.indexOf(sel); if(i>=0) mine.splice(i,1); sel=null; commit(); } }

  document.getElementById('exp').addEventListener('click',function(){ var fn=myChannel||chanFile(me);
    var blob=new Blob([JSON.stringify({user:me,channel:chanLabel(fn),t:Date.now(),objects:mine})],{type:'application/json'});
    var a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=fn; a.click(); setTimeout(function(){ URL.revokeObjectURL(a.href); },1000); });
  document.getElementById('imp').addEventListener('click',function(){ document.getElementById('fileJson').click(); });
  document.getElementById('fileJson').addEventListener('change',function(e){ var f=e.target.files[0]; if(!f) return; var r=new FileReader();
    r.onload=function(){ try{ var d=JSON.parse(r.result), objs=Array.isArray(d.objects)?d.objects:[]; var fn=chanFile(d.channel||d.user||'imported');
      others[fn]={ user:d.user||chanLabel(fn), objects:objs }; render(); updatePeers(); }catch(err){ alert('Not a valid board JSON.'); } };
    r.readAsText(f); e.target.value=''; });

  // ---- keyboard ---------------------------------------------------------
  window.addEventListener('keydown',function(e){
    if(e.code==='Space'){ spaceDown=true; if(mode!=='draw') canvas.style.cursor='grab'; }
    if(e.target.tagName==='INPUT') return;
    if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='z'){ e.preventDefault(); undo(); }
    else if(e.key==='Delete'||e.key==='Backspace'){ if(sel){ e.preventDefault(); delSel(); } }
    else if(e.key==='v'||e.key==='V'){ setTool('select'); }
    else if(e.key==='p'||e.key==='P'){ setTool('pen'); }
    else if(e.key==='h'||e.key==='H'){ setTool('pan'); }
  });
  window.addEventListener('keyup',function(e){ if(e.code==='Space'){ spaceDown=false; if(tool!=='pan') canvas.style.cursor='default'; } });
  window.addEventListener('resize',resize);

  // ---- boot -------------------------------------------------------------
  (async function(){
    await idbOpen(); await loadLocal(); resize(); updatePeers();
    try{
      var h=await idbGet('dirHandle');
      if(h){
        var perm = h.queryPermission ? await h.queryPermission({mode:'readwrite'}) : 'granted';
        if(perm==='granted'){                       // still authorised → fully auto-reconnect
          dirHandle=h; await readAll();
          if(myChannel && folderIndex[myChannel]){ adoptChannel(myChannel, true); startSync(); }
          else openChannelPicker();
        } else { armResume(); }                       // needs one click to re-grant (browser security)
      }
    }catch(e){ console.warn('restore failed', e); }
  })();
})();
</script>
</body>
</html>
